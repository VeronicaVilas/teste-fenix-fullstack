
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fenix_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fenix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - fenix-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fenix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fenix_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fenix-network

  redis:
    image: redis:7-alpine
    networks:
      - fenix-network

volumes:
  postgres-data:
  backend-vendor:
  frontend-node-modules:

networks:
  fenix-network:
    driver: bridge